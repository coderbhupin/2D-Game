<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pixel Quest II — The Adventures of Bit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#06070f;font-family:'Press Start 2P',monospace;-webkit-user-select:none;user-select:none;touch-action:none}
  #game{display:block;width:100vw;height:100vh;cursor:pointer}
  #hint{position:fixed;bottom:6px;left:0;right:0;text-align:center;color:#5b5b7a;font-size:8px;letter-spacing:1px;pointer-events:none}
  @media(max-width:820px){#hint{display:none}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hint">ARROWS/WASD MOVE &nbsp;•&nbsp; SPACE JUMP (x2 WITH BOOTS) &nbsp;•&nbsp; J SWORD &nbsp;•&nbsp; K BOW &nbsp;•&nbsp; SHIFT DASH &nbsp;•&nbsp; B SHOP &nbsp;•&nbsp; P PAUSE</div>
<script>
(() => {
"use strict";
/* ======================= SETUP ======================= */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let viewW = innerWidth, viewH = innerHeight, dpr = 1;
let groundY = 0;
const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;

function resize(){
  const old = groundY;
  viewW = innerWidth; viewH = innerHeight;
  dpr = Math.max(1, Math.min(devicePixelRatio || 1, 2));
  canvas.width = Math.floor(viewW*dpr); canvas.height = Math.floor(viewH*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  groundY = Math.round(viewH - 96);
  const d = groundY - old;
  if (old && Math.abs(d) < 4000 && level){
    player.y += d;
    for (const p of level.platforms) p.y += d;
    for (const c of level.coins) c.y += d;
    for (const e of level.enemies){ e.y += d; e.baseY += d; }
    for (const d2 of level.decor) d2.y += d;
    if (level.boss) { level.boss.y += d; level.boss.baseY += d; }
  }
}
addEventListener('resize', resize);

/* ======================= AUDIO ======================= */
let actx=null;
function audioInit(){ if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } }
function beep(f,dur,type,vol,slide){
  if(!actx) return;
  try{
    const o=actx.createOscillator(), g=actx.createGain();
    o.type=type||'square'; o.frequency.setValueAtTime(f, actx.currentTime);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40,slide), actx.currentTime+dur);
    g.gain.setValueAtTime(vol||0.06, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime+dur);
    o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime+dur);
  }catch(e){}
}
const SFX = {
  coin:()=>{beep(980,.07,'square',.05); setTimeout(()=>beep(1460,.09,'square',.05),60);},
  jump:()=>beep(420,.14,'square',.05,720),
  land:()=>beep(140,.06,'sine',.05),
  slash:()=>beep(300,.10,'sawtooth',.05,110),
  arrow:()=>beep(700,.08,'triangle',.04,300),
  hit:()=>beep(180,.16,'sawtooth',.07,70),
  block:()=>beep(880,.10,'square',.06,600),
  hurt:()=>beep(220,.28,'sawtooth',.08,60),
  buy:()=>{beep(660,.09,'square',.06); setTimeout(()=>beep(990,.12,'square',.06),90);},
  win:()=>{[523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,.16,'square',.06),i*110));},
  boss:()=>beep(90,.5,'sawtooth',.08,50)
};

/* ======================= INPUT ======================= */
const keys = {};
const pressed = {};
addEventListener('keydown', e=>{
  const k = e.key.toLowerCase();
  if(['arrowleft','arrowright','arrowup','arrowdown',' ','spacebar'].includes(k)) e.preventDefault();
  if(!keys[k]) pressed[k]=true;
  keys[k]=true; audioInit();
  if(k==='p' && (state==='playing'||state==='paused')) state = state==='playing'?'paused':'playing';
  if(k==='b' && (state==='playing'||state==='shop')) state = state==='playing'?'shop':'playing';
});
addEventListener('keyup', e=>{ keys[e.key.toLowerCase()]=false; });
function tapped(...ks){ for(const k of ks) if(pressed[k]) return true; return false; }
function held(...ks){ for(const k of ks) if(keys[k]) return true; return false; }

let touchBtns = [];
const touchState = {};
function pointerAt(x,y,down){
  for(const b of touchBtns){
    if(x>b.x && x<b.x+b.w && y>b.y && y<b.y+b.h){ touchState[b.id]=down; if(down) touchTap[b.id]=true; return b.id; }
  }
  return null;
}
const touchTap = {};
const activeTouches = {};
canvas.addEventListener('touchstart', e=>{ audioInit(); for(const t of e.changedTouches){ activeTouches[t.identifier]=pointerAt(t.clientX,t.clientY,true); } handleClick(e.changedTouches[0].clientX,e.changedTouches[0].clientY); e.preventDefault(); },{passive:false});
canvas.addEventListener('touchend', e=>{ for(const t of e.changedTouches){ const id=activeTouches[t.identifier]; if(id) touchState[id]=false; delete activeTouches[t.identifier]; } e.preventDefault(); },{passive:false});
canvas.addEventListener('touchmove', e=>{ e.preventDefault(); },{passive:false});
canvas.addEventListener('mousedown', e=>{ audioInit(); handleClick(e.clientX,e.clientY); });

/* ======================= STATE ======================= */
let state = 'menu'; // menu, howto, playing, paused, shop, dead, levelclear, victory
let levelNum = 1;
const MAX_LEVEL = 12;
let shake = 0, flash = 0, timeAcc = 0;

const save = (()=>{ try{ return JSON.parse(localStorage.getItem('pq2')||'{}'); }catch(e){ return {}; } })();
function persist(){ try{ localStorage.setItem('pq2', JSON.stringify({best: save.best|0})); }catch(e){} }

const player = {
  x:0,y:0,w:30,h:46,vx:0,vy:0,onGround:false,face:1,
  hp:3,maxHp:3,coins:0,score:0,
  jumps:0,invuln:0,anim:0,
  swordCd:0, swing:0, bowCd:0, dashCd:0, dash:0,
  shieldReady:true, shieldTimer:0, blockFx:0,
  items:{sword:false,bow:false,shield:false,boots:false,dash:false},
  arrows:0
};
function resetRun(){
  player.hp=3; player.maxHp=3; player.coins=0; player.score=0;
  player.items={sword:false,bow:false,shield:false,boots:false,dash:false};
  player.arrows=0; player.shieldReady=true; levelNum=1;
}

/* ======================= LEVEL GEN =======================
   Reachability rule: every platform is placed within
   dx <= 190 and dy <= 105 of a previously reachable surface,
   and every coin sits <= 86px above a solid surface.
   Jump apex with base jump = ~138px, so all coins are reachable. */
const GRAVITY = 2300, MOVE = 340, JUMP_V = 800, MAX_FALL = 1100;
let level = null;

function rngFactory(seed){ let s=seed; return ()=> (s = s*16807 % 2147483647)/2147483647; }

function makeLevel(n){
  const rnd = rngFactory(1000 + n*7919);
  const length = 3600 + n*420;
  const platforms = [], coins = [], enemies = [], decor = [], hazards = [];

  // ground with jumpable gaps
  let gx = 0;
  const gaps = [];
  while(gx < length){
    const seg = 620 + rnd()*520;
    platforms.push({x:gx, y:groundY, w:seg, h:200, kind:'ground'});
    const gap = (gx+seg < length-500) ? (120 + rnd()*70*Math.min(1,n/4)) : 0;
    if(gap) gaps.push({x:gx+seg, w:gap});
    gx += seg + gap;
  }

  // reachable floating platform chain
  let px = 300, py = groundY - 90;
  while(px < length - 420){
    const w = 96 + rnd()*90;
    py = Math.max(150, Math.min(groundY - 70, py + (rnd()*2-1)*100));
    platforms.push({x:px, y:Math.round(py), w:Math.round(w), h:22, kind: rnd()<0.35?'cloudstone':'brick'});
    const cn = 2 + Math.floor(rnd()*3);
    for(let i=0;i<cn;i++) coins.push({x:px+18+i*34, y:py-42, r:11, taken:false, t:rnd()*7});
    if(rnd()<0.42){
      const kind = rnd()<0.6?'grubling':'batling';
      enemies.push(makeEnemy(kind, px+w/2, py, px-10, px+w+10));
    }
    px += w + 110 + rnd()*70;
  }

  // ground coins & enemies
  for(let x=340; x<length-260; x+=210){
    if(gaps.some(g=>x>g.x-60 && x<g.x+g.w+60)) continue;
    if(rnd()<0.75) for(let i=0;i<3;i++) coins.push({x:x+i*34, y:groundY-52, r:11, taken:false, t:rnd()*7});
    if(rnd()<0.5){
      const roll = rnd();
      const kind = roll<0.45?'grubling': roll<0.72?'ironhusk':'spitter';
      enemies.push(makeEnemy(kind, x+40, groundY, x-90, x+190));
    }
  }
  // arch coins over each gap (reachable at apex of a running jump)
  for(const g of gaps){
    for(let i=0;i<3;i++) coins.push({x:g.x+g.w*(i+1)/4, y:groundY-70-(i===1?26:0), r:11, taken:false, t:rnd()*7});
  }

  // decor (parallax trees/bushes/rocks)
  for(let x=60;x<length;x+=120+rnd()*160){
    decor.push({x, y:groundY, type: rnd()<0.55?'tree': rnd()<0.6?'bush':'rock', s:0.8+rnd()*0.6});
  }

  const boss = (n % 4 === 0) ? makeBoss(length - 260, n) : null;

  return {length, platforms, coins, enemies, decor, hazards, boss,
    flagX: length - 90, arrows:[], rocks:[], parts:[], pops:[], cam:0, done:false};
}

function makeEnemy(kind,x,groundTop,minX,maxX){
  const S = {grubling:{w:38,h:36,hp:1,sp:62}, batling:{w:40,h:28,hp:1,sp:92},
             ironhusk:{w:48,h:44,hp:3,sp:48}, spitter:{w:42,h:40,hp:2,sp:34}}[kind];
  const y = kind==='batling' ? groundTop-150 : groundTop-S.h;
  return {kind,x:x-S.w/2,y,w:S.w,h:S.h,vx:S.sp*(Math.random()<.5?-1:1),vy:0,
    hp:S.hp,alive:true,t:Math.random()*9,baseY:y,minX,maxX,hurt:0,cd:1+Math.random(),
    charging:0, dead:0};
}
function makeBoss(x,n){
  return {x, y:groundY-110, w:104, h:110, baseY:groundY-110, vx:0, vy:0,
    hp:10+n, maxHp:10+n, alive:true, t:0, phase:'idle', cd:1.4, hurt:0, face:-1, stomp:0};
}

/* ======================= SHOP ======================= */
const SHOP = [
  {id:'sword', name:'IRON SWORD', cost:18, desc:'J / X : wide slash, cuts armor'},
  {id:'bow',   name:"HUNTER'S BOW", cost:26, desc:'K / C : fire arrows (+8 arrows)'},
  {id:'shield',name:'OAK SHIELD', cost:22, desc:'auto-blocks a hit, recharges 7s'},
  {id:'boots', name:'FEATHER BOOTS', cost:30, desc:'double jump — reach anything'},
  {id:'dash',  name:'WIND DASH', cost:24, desc:'SHIFT : dash through danger'},
  {id:'maxHp', name:'HEART VESSEL', cost:36, desc:'+1 maximum heart (and heal)'},
  {id:'quiver',name:'QUIVER x10', cost:9,  desc:'ten more arrows'},
  {id:'bread', name:'BREAD LOAF', cost:7,  desc:'restore one heart now'}
];
let shopSel = 0;
function buy(item){
  if(player.coins < item.cost) { beep(140,.15,'square',.06); return; }
  if(item.id==='bread'){ if(player.hp>=player.maxHp) return; player.hp++; }
  else if(item.id==='maxHp'){ player.maxHp++; player.hp=player.maxHp; }
  else if(item.id==='quiver'){ if(!player.items.bow) return; player.arrows+=10; }
  else { if(player.items[item.id]) return; player.items[item.id]=true; if(item.id==='bow') player.arrows+=8; }
  player.coins -= item.cost; SFX.buy();
}
function owned(item){
  if(item.id==='bread'||item.id==='maxHp'||item.id==='quiver') return false;
  return player.items[item.id];
}

/* ======================= START / FLOW ======================= */
function startLevel(n){
  levelNum = n;
  level = makeLevel(n);
  player.x = 90; player.y = groundY - player.h; player.vx=0; player.vy=0;
  player.invuln = 1; player.jumps = 0; player.shieldReady = true; player.shieldTimer=0;
  state = 'playing';
  if(level.boss) SFX.boss();
}
function damagePlayer(amount, fromX){
  if(player.invuln>0 || player.dash>0) return;
  if(player.items.shield && player.shieldReady){
    player.shieldReady=false; player.shieldTimer=7; player.blockFx=.35; player.invuln=.7;
    SFX.block(); shake=6; return;
  }
  player.hp -= amount; player.invuln = 1.3; SFX.hurt(); shake = 12; flash = .25;
  player.vx = (player.x < fromX ? -1:1)*260; player.vy = -320;
  if(player.hp<=0){ state='dead'; if((player.score|0) > (save.best|0)){ save.best = player.score|0; persist(); } }
}
function killEnemy(e, big){
  e.alive=false; e.dead=0.001; player.score += big?250:120;
  for(let i=0;i<12;i++) level.parts.push({x:e.x+e.w/2,y:e.y+e.h/2,vx:(Math.random()*2-1)*220,vy:-Math.random()*260,life:.6,c:enemyColor(e.kind),s:3+Math.random()*3});
  SFX.hit();
}
function enemyColor(k){ return {grubling:'#7fbf4d', batling:'#a06ad6', ironhusk:'#9aa7b8', spitter:'#d98a3a'}[k]||'#fff'; }

/* ======================= UPDATE ======================= */
function solidTop(p){ return p.y; }
function collide(o, dt){
  o.x += o.vx*dt;
  for(const p of level.platforms){
    if(p.kind!=='ground') continue;
    if(o.x < p.x+p.w && o.x+o.w > p.x && o.y+o.h > p.y+6 && o.y < p.y+p.h){
      if(o.vx>0) o.x = p.x - o.w; else if(o.vx<0) o.x = p.x+p.w;
      o.vx = 0;
    }
  }
  o.y += o.vy*dt;
  o.onGround = false;
  for(const p of level.platforms){
    if(o.x + o.w*0.8 < p.x || o.x + o.w*0.2 > p.x+p.w) continue;
    const top = solidTop(p);
    if(o.vy >= 0 && o.y + o.h >= top && o.y + o.h <= top + Math.max(22, o.vy*dt + 16)){
      o.y = top - o.h; o.vy = 0; o.onGround = true;
    }
  }
  if(o.x < 0) o.x = 0;
  if(o.x + o.w > level.length) o.x = level.length - o.w;
}

function update(dt){
  timeAcc += dt;
  shake = Math.max(0, shake - dt*40); flash = Math.max(0, flash - dt);
  if(state!=='playing') return;

  /* --- player --- */
  const left = held('arrowleft','a'), right = held('arrowright','d');
  const wantJump = tapped(' ','arrowup','w') || touchTap['jump'];
  const speed = MOVE * (player.dash>0?2.4:1);
  if(left && !right){ player.vx = -speed; player.face=-1; }
  else if(right && !left){ player.vx = speed; player.face=1; }
  else player.vx *= Math.exp(-14*dt);
  if(touchState['left']){ player.vx=-speed; player.face=-1; }
  if(touchState['right']){ player.vx=speed; player.face=1; }

  const maxJumps = player.items.boots ? 2 : 1;
  if(wantJump){
    if(player.onGround){ player.vy = -JUMP_V; player.jumps=1; SFX.jump(); }
    else if(player.jumps < maxJumps){ player.vy = -JUMP_V*0.92; player.jumps++; SFX.jump();
      for(let i=0;i<8;i++) level.parts.push({x:player.x+player.w/2,y:player.y+player.h,vx:(Math.random()*2-1)*120,vy:Math.random()*120,life:.35,c:'#cfe9ff',s:3});
    }
  }
  if(!held(' ','arrowup','w') && !touchState['jump'] && player.vy < -220) player.vy = -220;

  player.vy = Math.min(MAX_FALL, player.vy + GRAVITY*dt);
  if(player.dash>0){ player.vy = 0; player.dash -= dt; }
  const wasAir = !player.onGround;
  collide(player, dt);
  if(player.onGround){ player.jumps = 0; if(wasAir && player.vy===0) {} }
  if(player.y > viewH + 400){ player.hp=0; state='dead'; }

  player.anim += Math.abs(player.vx)*dt*0.05;
  player.invuln = Math.max(0, player.invuln-dt);
  player.swordCd = Math.max(0, player.swordCd-dt);
  player.bowCd = Math.max(0, player.bowCd-dt);
  player.dashCd = Math.max(0, player.dashCd-dt);
  player.swing = Math.max(0, player.swing-dt);
  player.blockFx = Math.max(0, player.blockFx-dt);
  if(!player.shieldReady){ player.shieldTimer-=dt; if(player.shieldTimer<=0) player.shieldReady=true; }

  // sword
  if((tapped('j','x')||touchTap['atk']) && player.items.sword && player.swordCd<=0){
    player.swordCd = .42; player.swing = .26; SFX.slash();
    const hx = player.face>0 ? player.x+player.w-6 : player.x-46;
    for(const e of level.enemies){
      if(!e.alive) continue;
      if(hx < e.x+e.w && hx+52 > e.x && player.y-10 < e.y+e.h && player.y+player.h+8 > e.y){
        e.hp -= 2; e.hurt=.2; if(e.hp<=0) killEnemy(e); else SFX.hit();
      }
    }
    const B = level.boss;
    if(B && B.alive && hx < B.x+B.w && hx+52 > B.x && player.y < B.y+B.h && player.y+player.h > B.y){
      B.hp -= 2; B.hurt=.2; shake=8; SFX.hit(); if(B.hp<=0){ B.alive=false; player.score+=1200; SFX.win(); }
    }
  }
  // bow
  if((tapped('k','c')||touchTap['shoot']) && player.items.bow && player.bowCd<=0 && player.arrows>0){
    player.bowCd = .34; player.arrows--; SFX.arrow();
    level.arrows.push({x:player.x+player.w/2, y:player.y+18, vx:760*player.face, life:1.6});
  }
  // dash
  if((tapped('shift')||touchTap['dash']) && player.items.dash && player.dashCd<=0){
    player.dash = .18; player.dashCd = 1.1; player.vx = 900*player.face; beep(520,.12,'triangle',.05,900);
  }

  /* --- coins --- */
  for(const c of level.coins){
    if(c.taken) continue; c.t += dt*6;
    if(Math.abs((player.x+player.w/2)-c.x) < 24 && Math.abs((player.y+player.h/2)-c.y) < 30){
      c.taken = true; player.coins++; player.score += 10; SFX.coin();
      level.pops.push({x:c.x,y:c.y,life:.6,txt:'+1'});
      for(let i=0;i<6;i++) level.parts.push({x:c.x,y:c.y,vx:(Math.random()*2-1)*130,vy:-Math.random()*160,life:.5,c:'#ffd75e',s:3});
    }
  }

  /* --- enemies --- */
  for(const e of level.enemies){
    if(!e.alive){ if(e.dead) e.dead += dt; continue; }
    e.t += dt; e.hurt = Math.max(0, e.hurt-dt);
    const pcx = player.x+player.w/2, ecx = e.x+e.w/2;
    const near = Math.abs(pcx-ecx) < 420 && Math.abs(player.y-e.y) < 300;

    if(e.kind==='batling'){
      // swoops toward the player when near, otherwise patrols in a wave
      e.x += e.vx*dt;
      if(e.x<e.minX){e.x=e.minX;e.vx*=-1;} if(e.x+e.w>e.maxX){e.x=e.maxX-e.w;e.vx*=-1;}
      const target = near ? Math.min(groundY-e.h-10, player.y) : e.baseY;
      e.y += (target + Math.sin(e.t*3)*16 - e.y) * Math.min(1, dt*(near?2.6:1.4));
    } else if(e.kind==='grubling'){
      // hops along its ledge
      e.vy = Math.min(MAX_FALL, e.vy + GRAVITY*dt);
      e.cd -= dt;
      if(e.cd<=0 && Math.abs(e.vy)<40){ e.vy = -430; e.cd = 1.2+Math.random()*.8; }
      collide(e, dt);
      if(e.x<=e.minX){e.x=e.minX; e.vx=Math.abs(e.vx);} if(e.x+e.w>=e.maxX){e.x=e.maxX-e.w; e.vx=-Math.abs(e.vx);}
      if(e.vx===0) e.vx = 62*(Math.random()<.5?-1:1);
    } else if(e.kind==='ironhusk'){
      // armored: stomp-proof, charges with a shoulder ram
      e.vy = Math.min(MAX_FALL, e.vy + GRAVITY*dt);
      if(near && Math.abs(player.y-e.y)<70){ e.charging = Math.min(1, e.charging+dt*1.4); }
      else e.charging = Math.max(0, e.charging-dt);
      const dir = e.charging>0.6 ? Math.sign(pcx-ecx) : Math.sign(e.vx||1);
      e.vx = dir * (48 + e.charging*230);
      collide(e, dt);
      if(e.x<=e.minX-60){e.x=e.minX-60; e.vx=Math.abs(e.vx);} if(e.x+e.w>=e.maxX+60){e.x=e.maxX+60-e.w; e.vx=-Math.abs(e.vx);}
    } else if(e.kind==='spitter'){
      // rooted plant-beast that lobs acid
      e.vy = Math.min(MAX_FALL, e.vy + GRAVITY*dt); e.vx = 0; collide(e,dt);
      e.cd -= dt;
      if(near && e.cd<=0){ e.cd = 1.7;
        const dir = Math.sign(pcx-ecx)||1;
        level.rocks.push({x:ecx,y:e.y+6,vx:dir*260,vy:-330,life:3,acid:true});
      }
    }

    // player contact
    if(player.dash<=0 && player.x < e.x+e.w && player.x+player.w > e.x && player.y < e.y+e.h && player.y+player.h > e.y){
      const stomping = player.vy > 60 && (player.y+player.h) - e.y < 26;
      if(stomping && e.kind!=='ironhusk'){
        killEnemy(e); player.vy = -520; player.jumps = 0;
      } else if(stomping && e.kind==='ironhusk'){
        player.vy = -420; SFX.block(); shake=6;   // spikes bounce you off
      } else damagePlayer(1, e.x+e.w/2);
    }
  }

  /* --- boss --- */
  const B = level.boss;
  if(B && B.alive){
    B.t += dt; B.hurt = Math.max(0,B.hurt-dt); B.cd -= dt;
    const pcx = player.x+player.w/2;
    B.face = Math.sign(pcx - (B.x+B.w/2)) || 1;
    if(B.phase==='idle' && B.cd<=0){
      B.phase = Math.random()<0.5 ? 'throw' : 'leap'; B.cd = .6;
      if(B.phase==='leap'){ B.vy = -760; B.vx = B.face*180; }
    } else if(B.phase==='throw' && B.cd<=0){
      for(let i=-1;i<=1;i++) level.rocks.push({x:B.x+B.w/2, y:B.y+20, vx:B.face*(280+i*70), vy:-360, life:4});
      B.phase='idle'; B.cd = 1.3; SFX.boss();
    }
    B.vy = Math.min(MAX_FALL, B.vy + GRAVITY*dt);
    const wasAirB = !B.onGround;
    collide(B, dt);
    if(B.phase==='leap'){
      if(B.onGround && wasAirB){
        B.phase='idle'; B.cd=1.1; B.vx=0; shake=16; B.stomp=.4;
        if(Math.abs(pcx-(B.x+B.w/2))<220 && player.onGround) damagePlayer(1, B.x+B.w/2);
        for(let i=0;i<20;i++) level.parts.push({x:B.x+B.w/2,y:B.y+B.h,vx:(Math.random()*2-1)*380,vy:-Math.random()*200,life:.6,c:'#b6a184',s:4});
      }
    } else B.vx *= Math.exp(-6*dt);
    B.stomp = Math.max(0,B.stomp-dt);
    if(player.dash<=0 && player.x<B.x+B.w && player.x+player.w>B.x && player.y<B.y+B.h && player.y+player.h>B.y){
      if(player.vy>80 && (player.y+player.h)-B.y < 34){ B.hp--; B.hurt=.2; player.vy=-560; SFX.hit(); }
      else damagePlayer(1, B.x+B.w/2);
    }
    if(B.hp<=0){ B.alive=false; player.score+=1200; shake=20; SFX.win();
      for(let i=0;i<40;i++) level.parts.push({x:B.x+B.w/2,y:B.y+B.h/2,vx:(Math.random()*2-1)*420,vy:(Math.random()*2-1)*420,life:1,c:'#c9b28f',s:5}); }
  }

  /* --- arrows --- */
  for(const a of level.arrows){
    a.x += a.vx*dt; a.life -= dt;
    for(const e of level.enemies){
      if(!e.alive) continue;
      if(a.x>e.x && a.x<e.x+e.w && a.y>e.y && a.y<e.y+e.h){ e.hp--; e.hurt=.2; a.life=0; if(e.hp<=0) killEnemy(e); else SFX.hit(); }
    }
    if(B && B.alive && a.x>B.x && a.x<B.x+B.w && a.y>B.y && a.y<B.y+B.h){ B.hp--; B.hurt=.2; a.life=0; SFX.hit(); }
  }
  level.arrows = level.arrows.filter(a=>a.life>0);

  /* --- boss rocks / acid --- */
  for(const r of level.rocks){
    r.vy += GRAVITY*0.55*dt; r.x += r.vx*dt; r.y += r.vy*dt; r.life -= dt;
    if(r.y > groundY-6){ r.life=0; for(let i=0;i<7;i++) level.parts.push({x:r.x,y:groundY-6,vx:(Math.random()*2-1)*160,vy:-Math.random()*140,life:.4,c:r.acid?'#9bd94a':'#a1927a',s:3}); }
    if(Math.abs(r.x-(player.x+player.w/2))<20 && Math.abs(r.y-(player.y+player.h/2))<26){ r.life=0; damagePlayer(1, r.x); }
  }
  level.rocks = level.rocks.filter(r=>r.life>0);

  /* --- fx --- */
  for(const p of level.parts){ p.vy += 900*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.life-=dt; }
  level.parts = level.parts.filter(p=>p.life>0);
  for(const p of level.pops){ p.y -= 46*dt; p.life -= dt; }
  level.pops = level.pops.filter(p=>p.life>0);

  /* --- flag --- */
  const bossAlive = B && B.alive;
  if(!bossAlive && player.x + player.w > level.flagX){
    player.score += 500 + player.hp*100;
    if(levelNum >= MAX_LEVEL){ state='victory'; SFX.win(); if((player.score|0)>(save.best|0)){save.best=player.score|0;persist();} }
    else { state='levelclear'; SFX.win(); }
  }

  // camera
  const want = Math.max(0, Math.min(level.length - viewW, player.x + player.w/2 - viewW*0.42));
  level.cam += (want - level.cam) * Math.min(1, dt*7);
}

/* ======================= DRAW HELPERS ======================= */
function rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function txt(s,x,y,size,color,align){ ctx.font = size+"px 'Press Start 2P', monospace"; ctx.fillStyle=color; ctx.textAlign=align||'left'; ctx.textBaseline='alphabetic'; ctx.fillText(s,x,y); }

/* ======================= BACKGROUND ======================= */
function drawBackground(){
  const cam = level ? level.cam : 0;
  const dusk = level && level.boss;
  const g = ctx.createLinearGradient(0,0,0,viewH);
  if(dusk){ g.addColorStop(0,'#2b1b3d'); g.addColorStop(.45,'#6b3550'); g.addColorStop(1,'#c9744a'); }
  else { g.addColorStop(0,'#4aa3e8'); g.addColorStop(.5,'#8fd0f2'); g.addColorStop(1,'#dff0d5'); }
  ctx.fillStyle=g; ctx.fillRect(0,0,viewW,viewH);

  // sun / moon glow
  const sx = viewW*0.78, sy = viewH*0.2;
  const sg = ctx.createRadialGradient(sx,sy,10,sx,sy,180);
  sg.addColorStop(0, dusk?'rgba(255,220,180,.9)':'rgba(255,250,210,.95)');
  sg.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=sg; ctx.beginPath(); ctx.arc(sx,sy,180,0,7); ctx.fill();

  // far mountains
  ctx.fillStyle = dusk?'#4a3355':'#7fb3d5';
  drawRidge(cam*0.12, groundY-60, 260, 150, dusk?'#4a3355':'#7fb3d5');
  drawRidge(cam*0.22 + 130, groundY-30, 200, 110, dusk?'#5b4066':'#9ac6e0');
  // hills
  ctx.fillStyle = dusk?'#3d5137':'#6bab52';
  for(let i=-1;i<viewW/220+2;i++){
    const x = i*220 - (cam*0.4)%220;
    ctx.beginPath(); ctx.arc(x, groundY+40, 150, Math.PI, 0); ctx.fill();
  }
  // clouds
  for(let i=0;i<7;i++){
    const cx = ((i*430 + timeAcc*14 - cam*0.15) % (viewW+600)) - 300;
    const cy = 60 + (i*47)%140;
    cloud(cx, cy, 0.7 + (i%3)*0.25, dusk?'rgba(255,214,190,.55)':'rgba(255,255,255,.85)');
  }
}
function drawRidge(off, baseY, w, h, color){
  ctx.fillStyle=color; ctx.beginPath(); ctx.moveTo(-100, baseY+120);
  for(let x=-100;x<viewW+200;x+=w/2){
    const t = (x+off)/w;
    ctx.lineTo(x, baseY - Math.abs(Math.sin(t*1.7))*h);
  }
  ctx.lineTo(viewW+200, baseY+120); ctx.closePath(); ctx.fill();
}
function cloud(x,y,s,c){
  ctx.fillStyle=c; ctx.beginPath();
  ctx.arc(x,y,26*s,0,7); ctx.arc(x+30*s,y-12*s,32*s,0,7); ctx.arc(x+64*s,y,24*s,0,7); ctx.arc(x+32*s,y+12*s,28*s,0,7);
  ctx.fill();
}

/* ======================= WORLD DRAW ======================= */
function drawDecor(){
  const cam = level.cam;
  for(const d of level.decor){
    const x = d.x - cam*0.85;
    if(x < -120 || x > viewW+120) continue;
    if(d.type==='tree'){
      ctx.fillStyle='#6b4a2c'; ctx.fillRect(x-5*d.s, d.y-56*d.s, 10*d.s, 56*d.s);
      const c = ctx.createRadialGradient(x, d.y-76*d.s, 4, x, d.y-70*d.s, 44*d.s);
      c.addColorStop(0,'#7fd05a'); c.addColorStop(1,'#2f7a35');
      ctx.fillStyle=c;
      ctx.beginPath(); ctx.arc(x, d.y-72*d.s, 34*d.s,0,7); ctx.arc(x-24*d.s,d.y-58*d.s,24*d.s,0,7); ctx.arc(x+24*d.s,d.y-58*d.s,24*d.s,0,7); ctx.fill();
    } else if(d.type==='bush'){
      ctx.fillStyle='#3e8f43'; ctx.beginPath();
      ctx.arc(x,d.y-10*d.s,16*d.s,0,7); ctx.arc(x+16*d.s,d.y-6*d.s,13*d.s,0,7); ctx.arc(x-16*d.s,d.y-6*d.s,13*d.s,0,7); ctx.fill();
    } else {
      ctx.fillStyle='#8d8a86'; ctx.beginPath(); ctx.ellipse(x,d.y-8*d.s,16*d.s,11*d.s,0,0,7); ctx.fill();
      ctx.fillStyle='#a9a6a1'; ctx.beginPath(); ctx.ellipse(x-4*d.s,d.y-12*d.s,8*d.s,5*d.s,0,0,7); ctx.fill();
    }
  }
}
function drawPlatforms(){
  const cam = level.cam;
  // chasm below the ground line so gaps read as deep pits
  const pg = ctx.createLinearGradient(0, groundY+14, 0, viewH);
  pg.addColorStop(0,'#2a2036'); pg.addColorStop(1,'#0a0812');
  ctx.fillStyle=pg; ctx.fillRect(0, groundY+14, viewW, viewH-groundY-14);
  for(const p of level.platforms){
    const x = p.x - cam;
    if(x > viewW+60 || x+p.w < -60) continue;
    if(p.kind==='ground'){
      const g = ctx.createLinearGradient(0,p.y,0,p.y+p.h);
      g.addColorStop(0,'#8a5a34'); g.addColorStop(.16,'#6d4527'); g.addColorStop(1,'#3f2716');
      ctx.fillStyle=g; ctx.fillRect(x,p.y,p.w,p.h);
      const gg = ctx.createLinearGradient(0,p.y-4,0,p.y+18);
      gg.addColorStop(0,'#8ede63'); gg.addColorStop(1,'#3f9a3c');
      ctx.fillStyle=gg; ctx.fillRect(x,p.y-4,p.w,20);
      ctx.fillStyle='rgba(0,0,0,.16)';
      for(let i=0;i<p.w;i+=26){ ctx.fillRect(x+i+((i/26|0)%2?13:0), p.y+26, 22, 3); }
      ctx.fillStyle='rgba(255,255,255,.09)';
      for(let i=0;i<p.w;i+=14) ctx.fillRect(x+i, p.y+16+((i*7)%40), 3, 3);
      ctx.strokeStyle='rgba(0,0,0,.25)'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(x,p.y+16); ctx.lineTo(x+p.w,p.y+16); ctx.stroke();
    } else if(p.kind==='cloudstone'){
      ctx.fillStyle='rgba(0,0,0,.18)'; rr(x+3,p.y+5,p.w,p.h,9); ctx.fill();
      const g = ctx.createLinearGradient(0,p.y,0,p.y+p.h);
      g.addColorStop(0,'#e9f4ff'); g.addColorStop(1,'#9dbcd6');
      ctx.fillStyle=g; rr(x,p.y,p.w,p.h,9); ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.7)'; rr(x+4,p.y+3,p.w-8,5,3); ctx.fill();
    } else {
      ctx.fillStyle='rgba(0,0,0,.2)'; ctx.fillRect(x+3,p.y+5,p.w,p.h);
      const g = ctx.createLinearGradient(0,p.y,0,p.y+p.h);
      g.addColorStop(0,'#d08a4c'); g.addColorStop(1,'#8d5326');
      ctx.fillStyle=g; ctx.fillRect(x,p.y,p.w,p.h);
      ctx.strokeStyle='rgba(60,30,10,.55)'; ctx.lineWidth=2;
      for(let i=0;i<p.w;i+=24){ ctx.strokeRect(x+i+1, p.y+1, 22, p.h-2); }
      ctx.fillStyle='rgba(255,255,255,.25)'; ctx.fillRect(x,p.y,p.w,3);
    }
  }
}
function drawCoins(){
  const cam = level.cam;
  for(const c of level.coins){
    if(c.taken) continue;
    const x = c.x - cam; if(x<-30||x>viewW+30) continue;
    const y = c.y + Math.sin(c.t*0.9)*4;
    const w = Math.abs(Math.cos(c.t*0.55))*c.r + 2;
    const gl = ctx.createRadialGradient(x,y,2,x,y,c.r*2.1);
    gl.addColorStop(0,'rgba(255,225,120,.45)'); gl.addColorStop(1,'rgba(255,225,120,0)');
    ctx.fillStyle=gl; ctx.beginPath(); ctx.arc(x,y,c.r*2.1,0,7); ctx.fill();
    const g = ctx.createLinearGradient(x-w,y-c.r,x+w,y+c.r);
    g.addColorStop(0,'#fff3b0'); g.addColorStop(.45,'#ffd23f'); g.addColorStop(1,'#c98a10');
    ctx.fillStyle=g; ctx.beginPath(); ctx.ellipse(x,y,w,c.r,0,0,7); ctx.fill();
    ctx.strokeStyle='#8a5c07'; ctx.lineWidth=2; ctx.stroke();
    if(w>5){ ctx.fillStyle='rgba(255,255,255,.75)'; ctx.beginPath(); ctx.ellipse(x-w*0.3,y-c.r*0.35,w*0.22,c.r*0.35,0,0,7); ctx.fill(); }
  }
}

/* ======================= CHARACTER ======================= */
function drawPlayer(){
  const cam = level.cam;
  const x = player.x - cam, y = player.y;
  if(player.invuln>0 && Math.floor(player.invuln*18)%2) return;
  const cx = x + player.w/2;
  const walk = player.onGround ? Math.sin(player.anim*2.2) * Math.min(1, Math.abs(player.vx)/260) : 0;
  const air = !player.onGround;

  // shadow
  ctx.fillStyle='rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(cx, y+player.h+4, 15, 5, 0,0,7); ctx.fill();

  ctx.save(); ctx.translate(cx, y); ctx.scale(player.face, 1);

  // back arm
  ctx.strokeStyle='#e5b58c'; ctx.lineWidth=6; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(-4,20); ctx.lineTo(-10 - walk*7, 30 + (air?-4:0)); ctx.stroke();

  // legs (blue trousers + boots)
  const lA = air ? -6 : walk*9, lB = air ? 6 : -walk*9;
  ctx.strokeStyle='#2f4a86'; ctx.lineWidth=7;
  ctx.beginPath(); ctx.moveTo(-4,32); ctx.lineTo(-4+lA, 43); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(4,32); ctx.lineTo(4+lB, 43); ctx.stroke();
  ctx.fillStyle='#5b3a1e';
  ctx.fillRect(-9+lA, 42, 11, 5); ctx.fillRect(-1+lB, 42, 11, 5);

  // torso: green tunic with belt
  const tg = ctx.createLinearGradient(-9,12,9,34);
  tg.addColorStop(0,'#4fae5a'); tg.addColorStop(1,'#2c7a3c');
  ctx.fillStyle=tg; rr(-10,14,20,20,5); ctx.fill();
  ctx.fillStyle='#6b4423'; ctx.fillRect(-10,28,20,4);
  ctx.fillStyle='#e0c04a'; ctx.fillRect(-3,28,6,4);
  // scarf
  ctx.fillStyle='#c8443a'; ctx.beginPath(); ctx.moveTo(-9,15); ctx.lineTo(9,15); ctx.lineTo(4,19); ctx.lineTo(-9,19); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-9,16); ctx.lineTo(-16 - (air?6:walk*5),24); ctx.lineTo(-9,24); ctx.closePath(); ctx.fill();

  // head: skin, hair, face
  ctx.fillStyle='#f0c29a'; rr(-8,-2,16,17,6); ctx.fill();
  ctx.fillStyle='#e0ac82'; ctx.fillRect(-8,11,16,3);
  // hair
  ctx.fillStyle='#4a2f19';
  ctx.beginPath(); ctx.moveTo(-9,4); ctx.quadraticCurveTo(-9,-6,0,-6); ctx.quadraticCurveTo(9,-6,9,4);
  ctx.lineTo(9,0); ctx.quadraticCurveTo(2,2,-4,0); ctx.lineTo(-9,4); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#5c3a20'; ctx.fillRect(-10,1,4,7);
  // eyes + brow + mouth
  ctx.fillStyle='#fff'; ctx.fillRect(1,4,5,4); ctx.fillRect(-6,4,4,4);
  ctx.fillStyle='#23324a'; ctx.fillRect(3,5,2,3); ctx.fillRect(-4,5,2,3);
  ctx.fillStyle='#3a2414'; ctx.fillRect(0,2,6,1.5); ctx.fillRect(-6,2,4,1.5);
  ctx.fillStyle='#a4644a'; ctx.fillRect(0,11,4,1.5);

  // shield on the arm (or on the back when broken)
  if(player.items.shield){
    const ready = player.shieldReady;
    ctx.save(); ctx.translate(-13, 22); ctx.rotate(ready?-0.15:0.4);
    ctx.fillStyle = ready?'#9a6b32':'#5c452a';
    ctx.beginPath(); ctx.moveTo(0,-10); ctx.lineTo(9,-7); ctx.lineTo(8,7); ctx.lineTo(0,13); ctx.lineTo(-8,7); ctx.lineTo(-9,-7); ctx.closePath(); ctx.fill();
    ctx.strokeStyle= ready?'#d9b271':'#7d6a4d'; ctx.lineWidth=2; ctx.stroke();
    ctx.fillStyle= ready?'#d9b271':'#7d6a4d'; ctx.fillRect(-2,-6,4,14);
    ctx.restore();
  }

  // sword + swing arc
  if(player.items.sword){
    const sw = player.swing>0 ? (1 - player.swing/0.26) : -1;
    ctx.save(); ctx.translate(9, 22);
    ctx.rotate(sw>=0 ? (-1.4 + sw*2.6) : 0.9);
    ctx.fillStyle='#6b4423'; ctx.fillRect(-2,-2,5,9);
    ctx.fillStyle='#c9a227'; ctx.fillRect(-6,-4,13,4);
    const bg = ctx.createLinearGradient(0,-30,0,0);
    bg.addColorStop(0,'#ffffff'); bg.addColorStop(1,'#9fb4c9');
    ctx.fillStyle=bg;
    ctx.beginPath(); ctx.moveTo(-2,-4); ctx.lineTo(2,-4); ctx.lineTo(3,-30); ctx.lineTo(0,-36); ctx.lineTo(-3,-30); ctx.closePath(); ctx.fill();
    ctx.restore();
    if(player.swing>0){
      ctx.strokeStyle='rgba(255,255,255,'+(player.swing/0.26*0.8)+')'; ctx.lineWidth=5;
      ctx.beginPath(); ctx.arc(10,22,32, -1.3 + (1-player.swing/0.26)*2.2, 0.3 + (1-player.swing/0.26)*2.2); ctx.stroke();
    }
  }
  // bow slung on the back
  if(player.items.bow){
    ctx.strokeStyle='#7a4f24'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(-11,22,11,-1.1,1.1); ctx.stroke();
    ctx.strokeStyle='rgba(255,255,255,.6)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(-6,12); ctx.lineTo(-6,32); ctx.stroke();
  }

  // front arm
  ctx.strokeStyle='#f0c29a'; ctx.lineWidth=6;
  ctx.beginPath(); ctx.moveTo(4,20); ctx.lineTo(10 + walk*7, 29 + (air?-6:0)); ctx.stroke();

  ctx.restore();

  if(player.blockFx>0){
    ctx.strokeStyle='rgba(140,210,255,'+(player.blockFx/0.35)+')'; ctx.lineWidth=4;
    ctx.beginPath(); ctx.arc(cx, y+22, 34+(1-player.blockFx/0.35)*14, 0,7); ctx.stroke();
  }
  if(player.dash>0){
    ctx.fillStyle='rgba(200,240,255,.35)';
    for(let i=1;i<4;i++) ctx.fillRect(cx - player.face*i*16 - 8, y+10, 14, 30);
  }
}

/* ======================= MONSTERS ======================= */
function drawEnemies(){
  const cam = level.cam;
  for(const e of level.enemies){
    if(!e.alive) continue;
    const x = e.x - cam, y = e.y;
    if(x<-90 || x>viewW+90) continue;
    ctx.save();
    if(e.hurt>0){ ctx.filter = 'brightness(2.2)'; }
    ctx.fillStyle='rgba(0,0,0,.22)';
    if(e.kind!=='batling'){ ctx.beginPath(); ctx.ellipse(x+e.w/2, y+e.h+3, e.w*0.45, 5,0,0,7); ctx.fill(); }
    if(e.kind==='grubling') drawGrubling(x,y,e);
    else if(e.kind==='batling') drawBatling(x,y,e);
    else if(e.kind==='ironhusk') drawIronhusk(x,y,e);
    else drawSpitter(x,y,e);
    ctx.restore();
  }
}
// mossy toad-goblin
function drawGrubling(x,y,e){
  const w=e.w,h=e.h, b=Math.sin(e.t*7)*2;
  const g = ctx.createLinearGradient(x,y,x,y+h);
  g.addColorStop(0,'#a8e05f'); g.addColorStop(1,'#3f7a2a');
  ctx.fillStyle=g; ctx.beginPath(); ctx.ellipse(x+w/2, y+h/2+b*0.2, w/2, h/2-b*0.15, 0,0,7); ctx.fill();
  // moss speckles
  ctx.fillStyle='rgba(30,70,25,.5)';
  for(let i=0;i<6;i++) ctx.beginPath(), ctx.arc(x+8+((i*11)%(w-14)), y+12+((i*7)%(h-16)), 2.4,0,7), ctx.fill();
  // belly
  ctx.fillStyle='rgba(255,255,240,.55)'; ctx.beginPath(); ctx.ellipse(x+w/2, y+h*0.68, w*0.28, h*0.2,0,0,7); ctx.fill();
  // eyes
  const dir = Math.sign(e.vx)||1;
  for(const o of [-8,7]){
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(x+w/2+o, y+11, 6,0,7); ctx.fill();
    ctx.fillStyle='#1b2b16'; ctx.beginPath(); ctx.arc(x+w/2+o+dir*2, y+11, 3,0,7); ctx.fill();
  }
  // mouth + fangs
  ctx.strokeStyle='#22400f'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(x+w/2,y+20,7,0.2,Math.PI-0.2); ctx.stroke();
  ctx.fillStyle='#fff'; ctx.fillRect(x+w/2-5,y+22,3,4); ctx.fillRect(x+w/2+2,y+22,3,4);
  // feet
  ctx.fillStyle='#2f5c1f'; ctx.fillRect(x+5,y+h-4,10,5); ctx.fillRect(x+w-15,y+h-4,10,5);
}
// wraith bat
function drawBatling(x,y,e){
  const w=e.w,h=e.h, f=Math.sin(e.t*13);
  ctx.fillStyle='#5b3b8a';
  ctx.beginPath();
  ctx.moveTo(x+w/2, y+h/2);
  ctx.quadraticCurveTo(x-14, y+h/2 - 18*f, x-6, y+h/2+12);
  ctx.quadraticCurveTo(x+w/2-8, y+h/2+8, x+w/2, y+h/2); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(x+w/2, y+h/2);
  ctx.quadraticCurveTo(x+w+14, y+h/2 - 18*f, x+w+6, y+h/2+12);
  ctx.quadraticCurveTo(x+w/2+8, y+h/2+8, x+w/2, y+h/2); ctx.fill();
  const g = ctx.createRadialGradient(x+w/2,y+h/2-3,2,x+w/2,y+h/2,16);
  g.addColorStop(0,'#7b57b8'); g.addColorStop(1,'#3a2358');
  ctx.fillStyle=g; ctx.beginPath(); ctx.ellipse(x+w/2, y+h/2, 13, 11,0,0,7); ctx.fill();
  ctx.fillStyle='#3a2358';
  ctx.beginPath(); ctx.moveTo(x+w/2-10,y+h/2-8); ctx.lineTo(x+w/2-5,y+h/2-20); ctx.lineTo(x+w/2-2,y+h/2-8); ctx.fill();
  ctx.beginPath(); ctx.moveTo(x+w/2+10,y+h/2-8); ctx.lineTo(x+w/2+5,y+h/2-20); ctx.lineTo(x+w/2+2,y+h/2-8); ctx.fill();
  ctx.fillStyle='#ffd34d'; ctx.beginPath(); ctx.arc(x+w/2-5,y+h/2-1,2.6,0,7); ctx.arc(x+w/2+5,y+h/2-1,2.6,0,7); ctx.fill();
  ctx.fillStyle='#fff'; ctx.fillRect(x+w/2-4,y+h/2+5,2,4); ctx.fillRect(x+w/2+2,y+h/2+5,2,4);
}
// armored beetle knight — stomp-proof
function drawIronhusk(x,y,e){
  const w=e.w,h=e.h;
  const g = ctx.createLinearGradient(x,y,x,y+h);
  g.addColorStop(0,'#d3dbe6'); g.addColorStop(.5,'#8f9dae'); g.addColorStop(1,'#4d5766');
  ctx.fillStyle=g; rr(x, y+8, w, h-8, 10); ctx.fill();
  // spiked ridge
  ctx.fillStyle='#e8eef6';
  for(let i=0;i<4;i++){ const sx = x+8+i*(w-16)/3;
    ctx.beginPath(); ctx.moveTo(sx-6,y+9); ctx.lineTo(sx,y-3); ctx.lineTo(sx+6,y+9); ctx.closePath(); ctx.fill(); }
  // rivets + plating
  ctx.strokeStyle='rgba(30,40,55,.55)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(x+4,y+24); ctx.lineTo(x+w-4,y+24); ctx.stroke();
  ctx.fillStyle='#6e7c8e';
  for(let i=0;i<5;i++){ ctx.beginPath(); ctx.arc(x+8+i*((w-16)/4), y+16, 2.2,0,7); ctx.fill(); }
  // glowing visor
  const chg = e.charging>0.6;
  ctx.fillStyle='#1c222c'; rr(x+8, y+28, w-16, 10, 4); ctx.fill();
  ctx.fillStyle= chg?'#ff5c4d':'#ffb03a';
  ctx.fillRect(x+12, y+31, w-24, 4);
  if(chg){ ctx.fillStyle='rgba(255,92,77,.25)'; ctx.beginPath(); ctx.arc(x+w/2,y+33,20,0,7); ctx.fill(); }
  // legs
  ctx.strokeStyle='#3b4453'; ctx.lineWidth=4;
  for(const o of [10, w-10]){ ctx.beginPath(); ctx.moveTo(x+o, y+h-4); ctx.lineTo(x+o+Math.sin(e.t*10)*4, y+h+4); ctx.stroke(); }
}
// rooted acid spitter
function drawSpitter(x,y,e){
  const w=e.w,h=e.h, sway=Math.sin(e.t*2)*3;
  ctx.strokeStyle='#3f6b2c'; ctx.lineWidth=7; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(x+w/2, y+h); ctx.quadraticCurveTo(x+w/2+sway, y+h/2, x+w/2+sway, y+14); ctx.stroke();
  ctx.fillStyle='#2f5a22';
  ctx.beginPath(); ctx.ellipse(x+6, y+h-8, 12, 5, -0.3,0,7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x+w-6, y+h-8, 12, 5, 0.3,0,7); ctx.fill();
  const g = ctx.createRadialGradient(x+w/2+sway, y+10, 2, x+w/2+sway, y+14, 20);
  g.addColorStop(0,'#ff9b6b'); g.addColorStop(1,'#b6392f');
  ctx.fillStyle=g; ctx.beginPath(); ctx.ellipse(x+w/2+sway, y+13, 15, 13, 0,0,7); ctx.fill();
  // maw
  ctx.fillStyle='#2a1216'; ctx.beginPath(); ctx.ellipse(x+w/2+sway, y+16, 8, 6, 0,0,7); ctx.fill();
  ctx.fillStyle='#8fe04a';
  const charge = Math.max(0, 1 - e.cd);
  ctx.beginPath(); ctx.arc(x+w/2+sway, y+16, 2+charge*4, 0,7); ctx.fill();
  ctx.fillStyle='#fff';
  for(let i=-1;i<=1;i+=2){ ctx.beginPath(); ctx.moveTo(x+w/2+sway+i*6, y+12); ctx.lineTo(x+w/2+sway+i*3, y+19); ctx.lineTo(x+w/2+sway+i*8, y+18); ctx.fill(); }
}
// stone golem boss
function drawBoss(){
  const B = level.boss; if(!B || !B.alive) return;
  const x = B.x - level.cam, y = B.y, w=B.w, h=B.h;
  ctx.save();
  if(B.hurt>0) ctx.filter='brightness(2)';
  ctx.fillStyle='rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(x+w/2,y+h+5,w*0.45,8,0,0,7); ctx.fill();
  const g = ctx.createLinearGradient(x,y,x,y+h);
  g.addColorStop(0,'#b9a789'); g.addColorStop(.6,'#8b7a5f'); g.addColorStop(1,'#5c503c');
  ctx.fillStyle=g;
  rr(x+10, y+26, w-20, h-30, 14); ctx.fill();          // torso
  rr(x+22, y-4, w-44, 34, 12); ctx.fill();             // head
  ctx.fillStyle='#6e6047';
  rr(x-6, y+34, 22, 46, 9); ctx.fill(); rr(x+w-16, y+34, 22, 46, 9); ctx.fill(); // arms
  rr(x+16, y+h-14, 26, 20, 6); ctx.fill(); rr(x+w-42, y+h-14, 26, 20, 6); ctx.fill();
  // cracks & moss
  ctx.strokeStyle='rgba(50,40,25,.6)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(x+26,y+40); ctx.lineTo(x+40,y+56); ctx.lineTo(x+32,y+72); ctx.stroke();
  ctx.fillStyle='#4f8f3c';
  ctx.beginPath(); ctx.ellipse(x+w/2+14, y+34, 14, 6, .2,0,7); ctx.fill();
  // eyes
  const glow = 0.6+Math.sin(B.t*6)*0.4;
  ctx.fillStyle='rgba(255,120,40,'+glow+')';
  ctx.beginPath(); ctx.arc(x+w/2-12, y+12, 6,0,7); ctx.arc(x+w/2+12, y+12, 6,0,7); ctx.fill();
  ctx.fillStyle='#ffe08a'; ctx.beginPath(); ctx.arc(x+w/2-12,y+12,2.5,0,7); ctx.arc(x+w/2+12,y+12,2.5,0,7); ctx.fill();
  ctx.restore();
  // hp bar
  const bw = 260, bx = viewW/2-bw/2;
  ctx.fillStyle='rgba(0,0,0,.55)'; rr(bx-4, 22, bw+8, 22, 6); ctx.fill();
  ctx.fillStyle='#7a1f1f'; ctx.fillRect(bx, 26, bw, 14);
  ctx.fillStyle='#e34b3c'; ctx.fillRect(bx, 26, bw*Math.max(0,B.hp/B.maxHp), 14);
  txt('STONE GOLEM', viewW/2, 18, 9, '#ffd9a0', 'center');
}

/* ======================= FX + FLAG ======================= */
function drawStuff(){
  const cam = level.cam;
  for(const a of level.arrows){
    const x = a.x-cam;
    ctx.strokeStyle='#c9a227'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(x,a.y); ctx.lineTo(x - Math.sign(a.vx)*20, a.y); ctx.stroke();
    ctx.fillStyle='#dfe7ef'; ctx.beginPath();
    ctx.moveTo(x+Math.sign(a.vx)*8,a.y); ctx.lineTo(x,a.y-4); ctx.lineTo(x,a.y+4); ctx.fill();
    ctx.fillStyle='#e34b3c';
    ctx.fillRect(x - Math.sign(a.vx)*22, a.y-4, 5, 8);
  }
  for(const r of level.rocks){
    const x = r.x-cam;
    if(r.acid){
      const g = ctx.createRadialGradient(x,r.y,1,x,r.y,10);
      g.addColorStop(0,'#eaffb0'); g.addColorStop(1,'#4f8f1c');
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,r.y,9,0,7); ctx.fill();
    } else {
      ctx.fillStyle='#8d7c60'; ctx.beginPath(); ctx.arc(x,r.y,13,0,7); ctx.fill();
      ctx.fillStyle='#b0a184'; ctx.beginPath(); ctx.arc(x-4,r.y-4,5,0,7); ctx.fill();
    }
  }
  for(const p of level.parts){
    ctx.globalAlpha = Math.max(0,p.life*1.6); ctx.fillStyle=p.c;
    ctx.fillRect(p.x-cam, p.y, p.s, p.s); ctx.globalAlpha=1;
  }
  for(const p of level.pops){ ctx.globalAlpha=Math.max(0,p.life); txt(p.txt, p.x-cam, p.y, 10, '#fff8d0','center'); ctx.globalAlpha=1; }

  // flag
  const fx = level.flagX - cam;
  if(fx > -80 && fx < viewW+80){
    ctx.fillStyle='#8b8f96'; ctx.fillRect(fx, groundY-190, 7, 190);
    ctx.fillStyle='#ffd23f'; ctx.beginPath(); ctx.arc(fx+3.5, groundY-194, 8,0,7); ctx.fill();
    const wob = Math.sin(timeAcc*4)*6;
    ctx.fillStyle='#39b54a';
    ctx.beginPath(); ctx.moveTo(fx+7, groundY-186); ctx.lineTo(fx+70+wob, groundY-168); ctx.lineTo(fx+7, groundY-150); ctx.closePath(); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.85)'; txt('★', fx+26, groundY-162, 12, '#fff');
  }
}

/* ======================= HUD ======================= */
function heart(x,y,s,filled){
  ctx.fillStyle = filled ? '#e8384f' : 'rgba(255,255,255,.22)';
  ctx.beginPath();
  ctx.moveTo(x, y+s*0.35);
  ctx.bezierCurveTo(x, y, x-s*0.5, y, x-s*0.5, y+s*0.35);
  ctx.bezierCurveTo(x-s*0.5, y+s*0.7, x, y+s*0.9, x, y+s*1.15);
  ctx.bezierCurveTo(x, y+s*0.9, x+s*0.5, y+s*0.7, x+s*0.5, y+s*0.35);
  ctx.bezierCurveTo(x+s*0.5, y, x, y, x, y+s*0.35);
  ctx.fill();
  if(filled){ ctx.fillStyle='rgba(255,255,255,.5)'; ctx.fillRect(x-s*0.28,y+s*0.22,s*0.14,s*0.14); }
}
function drawHUD(){
  ctx.fillStyle='rgba(8,10,22,.45)'; rr(10,10,300,58,10); ctx.fill();
  for(let i=0;i<player.maxHp;i++) heart(36+i*26, 20, 20, i < player.hp);
  txt('◆ '+player.coins, 22, 60, 11, '#ffd75e');
  txt('SCORE '+player.score, 110, 60, 9, '#dfe7ef');
  txt('LV '+levelNum+'/'+MAX_LEVEL, 240, 60, 9, '#9fe6ff');

  // item bar
  const items = [
    {on:player.items.sword, c:'#dfe7ef', l:'J'},
    {on:player.items.bow, c:'#c9a227', l:'K'},
    {on:player.items.shield, c:player.shieldReady?'#9a6b32':'#4b4b4b', l:'S'},
    {on:player.items.boots, c:'#9fe6ff', l:'2x'},
    {on:player.items.dash, c:'#b6f0d0', l:'⇧'}
  ];
  let ix = viewW-16;
  for(let i=items.length-1;i>=0;i--){
    const it=items[i]; ix -= 44;
    ctx.fillStyle = it.on ? 'rgba(8,10,22,.6)' : 'rgba(8,10,22,.25)';
    rr(ix,12,38,38,8); ctx.fill();
    ctx.globalAlpha = it.on?1:0.25;
    txt(it.l, ix+19, 37, 11, it.c, 'center'); ctx.globalAlpha=1;
  }
  if(player.items.bow) txt('ARROWS '+player.arrows, viewW-16, 66, 8, '#c9a227','right');
  txt('B = SHOP', viewW-16, 84, 8, '#8fa0b8','right');
}

/* ======================= SCREENS ======================= */
let buttons = [];
function button(id,label,x,y,w,h,color){
  buttons.push({id,x,y,w,h});
  ctx.fillStyle='rgba(0,0,0,.35)'; rr(x+3,y+4,w,h,10); ctx.fill();
  const g = ctx.createLinearGradient(0,y,0,y+h);
  g.addColorStop(0,color||'#3f8ad6'); g.addColorStop(1,'#1f4f86');
  ctx.fillStyle=g; rr(x,y,w,h,10); ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.35)'; ctx.lineWidth=2; rr(x,y,w,h,10); ctx.stroke();
  txt(label, x+w/2, y+h/2+5, 11, '#fff','center');
}
function panel(x,y,w,h){
  ctx.fillStyle='rgba(6,10,24,.86)'; rr(x,y,w,h,16); ctx.fill();
  ctx.strokeStyle='rgba(150,200,255,.4)'; ctx.lineWidth=3; rr(x,y,w,h,16); ctx.stroke();
}
function drawMenu(){
  drawBackground();
  const t = timeAcc;
  ctx.save(); ctx.translate(viewW/2, viewH*0.24 + Math.sin(t*2)*6);
  txt('PIXEL QUEST II', 0, 0, Math.min(38, viewW/16), '#0b1020','center');
  txt('PIXEL QUEST II', -3, -3, Math.min(38, viewW/16), '#ffd23f','center');
  ctx.restore();
  txt('THE ADVENTURES OF BIT', viewW/2, viewH*0.24+40, 10, '#eaf6ff','center');
  buttons=[];
  button('play','START QUEST', viewW/2-130, viewH*0.44, 260, 54, '#4caf50');
  button('how','HOW TO PLAY', viewW/2-130, viewH*0.44+70, 260, 46);
  txt('BEST '+(save.best|0), viewW/2, viewH*0.44+152, 10, '#9fe6ff','center');
}
function drawHow(){
  drawBackground(); panel(viewW/2-300, 60, 600, viewH-140);
  txt('HOW TO PLAY', viewW/2, 108, 16, '#ffd23f','center');
  const lines = [
    'MOVE   ARROWS / A D',
    'JUMP   SPACE (DOUBLE WITH BOOTS)',
    'SWORD  J   BOW  K   DASH  SHIFT',
    'SHOP   B   PAUSE  P',
    '',
    'STOMP soft monsters. ARMORED ironhusks',
    'must be cut with the SWORD or shot.',
    'Every coin sits within one jump of solid',
    'ground — nothing is out of reach.',
    'Spend coins in the SHOP between fights.'
  ];
  lines.forEach((l,i)=> txt(l, viewW/2, 160+i*30, 9, i<4?'#9fe6ff':'#dfe7ef','center'));
  buttons=[]; button('back','BACK', viewW/2-90, viewH-120, 180, 46);
}
function drawShop(){
  drawWorld();
  ctx.fillStyle='rgba(4,6,16,.72)'; ctx.fillRect(0,0,viewW,viewH);
  const w = Math.min(660, viewW-40), h = Math.min(520, viewH-40);
  const x = viewW/2-w/2, y = viewH/2-h/2;
  panel(x,y,w,h);
  txt("MERCHANT'S PACK", x+w/2, y+40, 15, '#ffd23f','center');
  txt('◆ '+player.coins, x+w/2, y+64, 11, '#ffd75e','center');
  buttons=[];
  SHOP.forEach((it,i)=>{
    const iy = y+84+i*44;
    const own = owned(it), afford = player.coins>=it.cost;
    ctx.fillStyle = own?'rgba(60,120,70,.35)':(afford?'rgba(60,90,150,.35)':'rgba(60,60,70,.3)');
    rr(x+20, iy, w-40, 38, 8); ctx.fill();
    txt(it.name, x+34, iy+17, 9, own?'#8ef0a0':(afford?'#fff':'#8b8b96'));
    txt(it.desc, x+34, iy+31, 7, '#9fb3c8');
    txt(own?'OWNED':('◆'+it.cost), x+w-34, iy+24, 9, own?'#8ef0a0':(afford?'#ffd75e':'#8b8b96'), 'right');
    if(!own) buttons.push({id:'buy'+i, x:x+20, y:iy, w:w-40, h:38});
  });
  txt('CLICK TO BUY   •   B / ESC TO CLOSE', x+w/2, y+h-22, 8, '#8fa0b8','center');
}
function drawOverlayCentered(title, sub, btnId, btnLabel, color){
  ctx.fillStyle='rgba(4,6,16,.72)'; ctx.fillRect(0,0,viewW,viewH);
  panel(viewW/2-260, viewH/2-140, 520, 280);
  txt(title, viewW/2, viewH/2-70, 20, color||'#ffd23f','center');
  sub.forEach((s,i)=>txt(s, viewW/2, viewH/2-24+i*26, 9, '#dfe7ef','center'));
  buttons=[]; button(btnId, btnLabel, viewW/2-120, viewH/2+60, 240, 50, color==='#e8384f'?'#c0392b':'#4caf50');
}

/* ======================= TOUCH UI ======================= */
function drawTouch(){
  if(!isTouch) return;
  touchBtns = [];
  const s = 62, pad = 18, by = viewH - s - pad;
  const defs = [
    {id:'left', x:pad, y:by, l:'◀'},
    {id:'right', x:pad+s+10, y:by, l:'▶'},
    {id:'jump', x:viewW-pad-s, y:by, l:'▲'},
    {id:'atk', x:viewW-pad-s*2-10, y:by, l:'⚔'},
    {id:'shoot', x:viewW-pad-s*2-10, y:by-s-10, l:'➵'},
    {id:'dash', x:viewW-pad-s, y:by-s-10, l:'⇉'},
    {id:'shop', x:viewW/2-s/2, y:by, l:'B'}
  ];
  for(const d of defs){
    touchBtns.push({id:d.id, x:d.x, y:d.y, w:s, h:s});
    ctx.fillStyle = touchState[d.id]?'rgba(255,255,255,.32)':'rgba(255,255,255,.16)';
    rr(d.x,d.y,s,s,14); ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.3)'; ctx.lineWidth=2; rr(d.x,d.y,s,s,14); ctx.stroke();
    txt(d.l, d.x+s/2, d.y+s/2+7, 16, '#fff','center');
  }
}

/* ======================= CLICKS ======================= */
function handleClick(cx,cy){
  for(const b of buttons){
    if(cx>b.x && cx<b.x+b.w && cy>b.y && cy<b.y+b.h){
      if(b.id==='play'){ resetRun(); startLevel(1); }
      else if(b.id==='how') state='howto';
      else if(b.id==='back') state='menu';
      else if(b.id==='next') startLevel(levelNum+1);
      else if(b.id==='retry'){ resetRun(); startLevel(1); }
      else if(b.id==='menu') state='menu';
      else if(b.id==='resume') state='playing';
      else if(b.id.startsWith('buy')) buy(SHOP[+b.id.slice(3)]);
      return;
    }
  }
  if(isTouch && state==='playing'){
    for(const b of touchBtns) if(cx>b.x&&cx<b.x+b.w&&cy>b.y&&cy<b.y+b.h){ if(b.id==='shop') state='shop'; return; }
  }
}

/* ======================= RENDER ======================= */
function drawWorld(){
  drawBackground();
  ctx.save();
  if(shake>0) ctx.translate((Math.random()*2-1)*shake, (Math.random()*2-1)*shake);
  drawDecor();
  drawPlatforms();
  drawCoins();
  drawStuff();
  drawEnemies();
  drawBoss();
  drawPlayer();
  ctx.restore();
  if(flash>0){ ctx.fillStyle='rgba(255,80,80,'+(flash*0.7)+')'; ctx.fillRect(0,0,viewW,viewH); }
  drawHUD();
  drawTouch();
}
function render(){
  buttons = [];
  if(state==='menu') drawMenu();
  else if(state==='howto') drawHow();
  else if(state==='shop') drawShop();
  else {
    drawWorld();
    if(state==='paused') drawOverlayCentered('PAUSED', ['PRESS P TO RESUME'], 'resume','RESUME');
    if(state==='dead') drawOverlayCentered('YOU FELL', ['SCORE '+player.score, 'COINS '+player.coins], 'retry','TRY AGAIN', '#e8384f');
    if(state==='levelclear') drawOverlayCentered('LEVEL '+levelNum+' CLEAR', ['SCORE '+player.score, 'COINS '+player.coins+'  —  PRESS B TO SHOP'], 'next','NEXT LEVEL');
    if(state==='victory') drawOverlayCentered('QUEST COMPLETE!', ['FINAL SCORE '+player.score], 'menu','MAIN MENU');
  }
}

/* ======================= LOOP ======================= */
let last = performance.now();
function loop(now){
  const dt = Math.min(0.033, (now-last)/1000); last = now;
  if(state==='levelclear' && tapped('enter',' ')) startLevel(levelNum+1);
  if((state==='dead') && tapped('enter',' ')) { resetRun(); startLevel(1); }
  if(state==='menu' && tapped('enter',' ')) { resetRun(); startLevel(1); }
  if(state==='shop'){
    if(tapped('escape')) state='playing';
    if(tapped('arrowdown','s')) shopSel=(shopSel+1)%SHOP.length;
    if(tapped('arrowup','w')) shopSel=(shopSel+SHOP.length-1)%SHOP.length;
    if(tapped('enter')) buy(SHOP[shopSel]);
  }
  update(dt);
  render();
  for(const k in pressed) delete pressed[k];
  for(const k in touchTap) delete touchTap[k];
  requestAnimationFrame(loop);
}
resize();
requestAnimationFrame(loop);
})();
</script>
